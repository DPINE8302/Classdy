<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="description" content="Classdy is a private, offline-first academic schedule and attendance assistant." />
  <meta name="theme-color" content="#007aff" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Classdy</title>
  <script>try{const s=JSON.parse(localStorage.getItem('classdy-settings')||'{}');if(s.theme==='dark'||(s.theme!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch{}</script>
  <link rel="stylesheet" href="/index.css" />
</head>
<body class="bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-900 dark:text-zinc-50">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>undefined))</script>
</body>
</html>
